name: Log wait times

on:
  schedule:
    # Restart safety net only. The job itself samples every 15 minutes for
    # about 5h45m (under the 6h runner limit). GitHub often skips */15.
    - cron: '7 */3 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Log a sample even outside the window or inside the 12-minute gap
        required: false
        type: boolean
        default: false
      rebuild:
        description: Rebuild waits/rollup.json from waits/days
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: log-waits
  cancel-in-progress: false

jobs:
  log:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Platform cap is 360. The loop stops itself at 5h45m.
    timeout-minutes: 359
    steps:
      # Parent commit must be present. `git commit --amend` on a depth-1
      # clone drops that parent and the force-push would orphan main.
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 2

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Sample and commit until the job budget
        env:
          # First pass only. Later passes use the normal window and gap.
          LOG_FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force && '1' || '0' }}
          LOG_REBUILD: ${{ github.event_name == 'workflow_dispatch' && inputs.rebuild && '1' || '0' }}
        run: bash scripts/log-loop.sh
